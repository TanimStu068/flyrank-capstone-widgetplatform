name: flyrank-capstone-widgetplatform
run: docker compose up --build        # or, without Docker: npm ci && npm start
seed: docker compose exec app npm run seed   # demo data is also seeded automatically on boot
test: npm test
base_url: http://localhost:3000
demo_api_key: demo_key_local_only     # demo-only; used by the seeded demo tenant
demo_widget_id: demo-widget
customer_site: http://localhost:5500
endpoints:
  health: GET /health
  register: POST /api/auth/register
  widgets: GET|POST /api/widgets, GET|PATCH|DELETE /api/widgets/:id, GET /api/widgets/:id/snippet
  embed_loader: GET /widget.js?id=demo-widget
  public_config: GET /widgets/demo-widget/config
  public_submission: POST /submissions        # CORS + preflight, body {widgetId, data, hp?}
  dashboard: GET /api/submissions, GET /api/submissions/:id, GET /api/stats
  fault_injection: GET|POST /debug/faults     # body {geoA?, geoB?, email?, reset?}
probes:
  1_valid_submission: POST /submissions with Origin header, then GET /api/submissions
  2_bad_payloads: malformed JSON -> 400, oversized (>10kb) -> 413
  3_burst: 30 rapid POSTs from one IP -> 429s (Retry-After); another IP still gets 201
  4_geo_fallback: POST /debug/faults {"geoA":true} then {"geoB":true}, submit after each
  5_email_failure: POST /debug/faults {"email":true}, submit -> still 201
  6_honeypot: POST /submissions with "hp":"anything" -> 202, nothing stored
