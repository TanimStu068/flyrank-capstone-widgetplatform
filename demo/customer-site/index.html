<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customer site (second origin)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}</style>
</head>
<body>
  <h1>Acme Corp</h1>
  <p>This page is served from <code>http://localhost:5500</code>, a different origin than the API on port 3000.
     The widget below arrives via one <code>&lt;script&gt;</code> line, and its submissions are cross-origin requests.</p>

  <!-- The embed snippet, exactly as returned by GET /api/widgets/:id/snippet -->
  <script src="http://localhost:3000/widget.js?id=demo-widget" async></script>
</body>
</html>
